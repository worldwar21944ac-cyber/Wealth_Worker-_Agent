name: Deploy kyc-gateway v10.0

on:
  push:
    branches: [main]
    paths:
      - 'kyc-gateway/**'
      - '.github/workflows/deploy-kyc-gateway.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests (135 assertions)
        run: node kyc-gateway/unit_test.cjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install -g wrangler@latest
      - name: Deploy kyc-gateway v10.0
        working-directory: kyc-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b
        run: wrangler deploy worker.js --name kyc-gateway --compatibility-date 2026-09-02
      - name: Seed KV sanctions lists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node kyc-gateway/seed_kv.js
      - name: Health check
        run: |
          sleep 5
          curl -sf https://kyc.wwwknockoutforever.com/api/kyc/health | python3 -m json.tool || echo "Health check pending"
      - name: E2E smoke test
        env:
          KYC_BASE_URL: https://kyc.wwwknockoutforever.com
          KYC_ADMIN_KEY: ${{ secrets.KYC_ADMIN_KEY }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
        run: bash kyc-gateway/test.sh || echo "E2E tests pending propagation"
