name: Deploy kyc-gateway v15.0

on:
  push:
    branches: [main]
    paths:
      - 'kyc-gateway/**'
      - '.github/workflows/deploy-kyc-gateway.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run unit tests (168 assertions)
        run: node kyc-gateway/unit_test.cjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Wrangler
        run: npm install -g wrangler@latest
      - name: Deploy kyc-gateway v15.0
        working-directory: kyc-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b
        run: wrangler deploy worker.js --name kyc-gateway --compatibility-date 2026-09-02
      - name: Health check
        run: |
          sleep 6
          curl -sf https://kyc.wwwknockoutforever.com/api/kyc/health | python3 -m json.tool || echo "Health check pending propagation"
