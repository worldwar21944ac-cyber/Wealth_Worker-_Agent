name: Deploy AI Search Worker

on:
  push:
    branches: [main]
    paths:
      - 'ai-search/**'
      - '.github/workflows/deploy-ai-search.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ai-search to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      # ── Create Vectorize index (idempotent) ──────────────────────────────
      - name: Create Vectorize index (if not exists)
        working-directory: ai-search
        run: |
          wrangler vectorize create ai-search-index \
            --dimensions=768 \
            --metric=cosine \
            2>&1 || echo "Index may already exist — continuing"
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b

      # ── Deploy worker ────────────────────────────────────────────────────
      - name: Deploy Worker
        working-directory: ai-search
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b

      # ── Set SEARCH_ADMIN_KEY secret ──────────────────────────────────────
      - name: Set SEARCH_ADMIN_KEY secret
        working-directory: ai-search
        run: |
          echo "search-admin-bervashun-2026" | \
          wrangler secret put SEARCH_ADMIN_KEY
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b

      # ── Add custom domain ────────────────────────────────────────────────
      - name: Add Custom Domain (ai-search.wwwknockoutforever.com)
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/fd6f05d3bbca4cc5f175ca4f7154552b/workers/scripts/ai-search/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"hostname":"ai-search.wwwknockoutforever.com","zone_id":"525461af7dfa6b8bbe5f8f7d465602a0"}' \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Domain:', r.get('result',{}).get('hostname','?'), '| success:', r.get('success'))" \
            2>&1 || echo "Domain may already be configured"

      # ── Health check ─────────────────────────────────────────────────────
      - name: Health check (post-deploy)
        run: |
          sleep 8
          curl -sf https://ai-search.wwwknockoutforever.com/health \
            && echo " ✅ AI Search is live" \
            || echo "⚠️  Health check pending (DNS propagation may take a moment)"
