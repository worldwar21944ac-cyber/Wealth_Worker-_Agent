name: Deploy ai-search Worker

on:
  push:
    branches: [main]
    paths:
      - "ai-search/**"
      - ".github/workflows/deploy-ai-search.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-search

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Create Vectorize index (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b
        run: |
          wrangler vectorize create ai-search-index \
            --dimensions=768 \
            --metric=cosine || echo "Index may already exist — continuing"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: fd6f05d3bbca4cc5f175ca4f7154552b
          workingDirectory: ai-search
          wranglerVersion: "latest"

      - name: Set SEARCH_ADMIN_KEY secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b
        run: |
          echo "${{ secrets.SEARCH_ADMIN_KEY }}" | \
            wrangler secret put SEARCH_ADMIN_KEY \
            --name ai-search

      - name: Bind custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/fd6f05d3bbca4cc5f175ca4f7154552b/workers/scripts/ai-search/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"hostname":"ai-search.wwwknockoutforever.com","zone_id":"525461af7dfa6b8bbe5f8f7d465602a0","service":"ai-search","environment":"production"}' \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print('Domain bound:', d.get('success'))"

      - name: Smoke test
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://ai-search.wwwknockoutforever.workers.dev/health)
          echo "Health check → HTTP $STATUS"
          curl -s https://ai-search.wwwknockoutforever.workers.dev/health | python3 -m json.tool
          [ "$STATUS" = "200" ] && echo "✅ ai-search is LIVE" || (echo "❌ Health check failed" && exit 1)
