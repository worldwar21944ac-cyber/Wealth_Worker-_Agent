name: Deploy AI Search Worker

on:
  push:
    branches: [main]
    paths:
      - 'ai-search/**'
      - '.github/workflows/deploy-ai-search.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ai-search to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Create Vectorize index (idempotent) ──────────────────────────────
      - name: Create Vectorize index (if not exists)
        working-directory: ai-search
        run: |
          npx wrangler vectorize create ai-search-index \
            --dimensions=768 \
            --metric=cosine \
            --account-id fd6f05d3bbca4cc5f175ca4f7154552b \
            2>&1 || echo "Index may already exist — continuing"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # ── Deploy worker ────────────────────────────────────────────────────
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: fd6f05d3bbca4cc5f175ca4f7154552b
          workingDirectory: ai-search
          command: deploy

      # ── Set SEARCH_ADMIN_KEY secret ──────────────────────────────────────
      - name: Set SEARCH_ADMIN_KEY secret
        working-directory: ai-search
        run: |
          echo "${{ secrets.SEARCH_ADMIN_KEY }}" | \
          npx wrangler secret put SEARCH_ADMIN_KEY \
            --account-id fd6f05d3bbca4cc5f175ca4f7154552b
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # ── Add custom domain route ──────────────────────────────────────────
      - name: Add Custom Domain (ai-search.wwwknockoutforever.com)
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/fd6f05d3bbca4cc5f175ca4f7154552b/workers/scripts/ai-search/domains" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"hostname":"ai-search.wwwknockoutforever.com","zone_id":"525461af7dfa6b8bbe5f8f7d465602a0"}' \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Domain:', r.get('result',{}).get('hostname','?'), '|', 'success:', r.get('success'))" \
            2>&1 || echo "Domain may already be configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Health check (post-deploy)
        run: |
          sleep 5
          curl -sf https://ai-search.wwwknockoutforever.com/health && echo " ✅ AI Search is live" || echo "⚠️  Health check pending (DNS propagation)"
