name            = "ai-search"
main            = "worker.js"
compatibility_date = "2026-09-02"
account_id      = "fd6f05d3bbca4cc5f175ca4f7154552b"

[limits]
cpu_ms = 30000

# ── Workers AI ──────────────────────────────────────────────────────────────────
[ai]
binding = "AI"

# ── Vectorize ───────────────────────────────────────────────────────────────────
[[vectorize]]
binding        = "VECTORIZE"
index_name     = "ai-search-index"

# ── D1 ──────────────────────────────────────────────────────────────────────────
[[d1_databases]]
binding      = "SEARCH_DB"
database_name = "bervashun-audit"
database_id  = "f2fe6105-b552-42b4-a2ca-9d2a349861da"

# ── Routes ──────────────────────────────────────────────────────────────────────
[[routes]]
pattern = "ai-search.wwwknockoutforever.com/*"
zone_name = "wwwknockoutforever.com"
