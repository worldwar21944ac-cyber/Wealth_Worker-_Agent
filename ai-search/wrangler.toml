name = "ai-search"
main = "worker.js"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat"]
account_id = "fd6f05d3bbca4cc5f175ca4f7154552b"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "ai-search-index"

[[d1_databases]]
binding       = "SEARCH_DB"
database_name = "bervashun-audit"
database_id   = "f2fe6105-b552-42b4-a2ca-9d2a349861da"

[limits]
cpu_ms = 30000

[vars]
SERVICE_NAME = "ai-search"
VERSION      = "2.0"

# Secret: SEARCH_ADMIN_KEY — set via CI or: wrangler secret put SEARCH_ADMIN_KEY
