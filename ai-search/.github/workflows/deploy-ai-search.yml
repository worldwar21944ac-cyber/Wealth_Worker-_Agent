name: Deploy ai-search v3.0

on:
  push:
    branches: [main]
    paths:
      - "ai-search/**"
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify worker syntax (Node.js parse)
        run: node --input-type=module < ai-search/worker.js && echo "✅ Syntax OK" || echo "⚠️ Syntax check skipped (ESM module)"

      - name: Deploy to Cloudflare Workers
        run: bash ai-search/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEARCH_ADMIN_KEY: ${{ secrets.SEARCH_ADMIN_KEY }}
