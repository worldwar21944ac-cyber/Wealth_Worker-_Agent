name: Deploy ai-search Worker

on:
  push:
    branches: [main]
    paths:
      - "ai-search/**"
      - ".github/workflows/deploy-ai-search.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Create Vectorize index if it doesn't exist yet
      - name: Ensure Vectorize index exists
        working-directory: ai-search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b
        run: |
          npx wrangler@latest vectorize create ai-search-index \
            --dimensions=768 \
            --metric=cosine \
            --description="AI Search semantic index (bge-base-en-v1.5)" || \
          echo "Index already exists — continuing"

      # Set the admin key secret
      - name: Set SEARCH_ADMIN_KEY secret
        working-directory: ai-search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd6f05d3bbca4cc5f175ca4f7154552b
        run: |
          echo "${{ secrets.SEARCH_ADMIN_KEY }}" | \
          npx wrangler@latest secret put SEARCH_ADMIN_KEY --name ai-search

      # Deploy the worker
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fd6f05d3bbca4cc5f175ca4f7154552b
          workingDirectory: ai-search
          command: deploy

      # Smoke-test the health endpoint
      - name: Health Check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ai-search.wwwknockoutforever.com/health)
          echo "Health status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Worker is live" || echo "⚠️ Health check returned $STATUS"
